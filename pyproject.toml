[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "justfit-mlx"
dynamic = ["version", "dependencies"]
description = "JustFit is an MLX inference runtime for long-context local LLM serving, combining compressed KV execution, phase-aware component residency, and state-preserving serving transitions. Built on mlx-vlm."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# The import package remains `mlx_vlm`: this is a renamed distribution of a
# derivative work, not a rewrite. Upstream authorship is retained here and the
# original copyright notice is retained in LICENSE.
authors = [
    {name = "Yuhua Chen"},
    {name = "Prince Canuma", email = "prince.gdt@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/YuhuaBillChen/justfit-mlx"
Repository = "https://github.com/YuhuaBillChen/justfit-mlx"
Issues = "https://github.com/YuhuaBillChen/justfit-mlx/issues"
Paper = "https://arxiv.org/abs/2609.17475"
Upstream = "https://github.com/Blaizzy/mlx-vlm"

[project.scripts]
"mlx_vlm.chat_ui" = "mlx_vlm.chat_ui:main"
"mlx_vlm.chat" = "mlx_vlm.chat:main"
"mlx_vlm.convert" = "mlx_vlm.convert:main"
"mlx_vlm.generate" = "mlx_vlm.generate:main"
"mlx_vlm.moe_offload" = "mlx_vlm.moe_offload:main"
"mlx_vlm.server" = "mlx_vlm.server:main"

[tool.setuptools.packages.find]
include = ["mlx_vlm*"]
exclude = ["mlx_vlm.tests*"]

[tool.setuptools.package-data]
mlx_vlm = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "mlx_vlm.version.__version__"}
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
ui = ["gradio>=5.19.0"]
cuda = ["mlx-cuda"]
cpu = ["mlx-cpu"]
train = ["datasets>=2.19.1"]
realtime = ["sounddevice>=0.5.0"]
